# Based on the OpenMetadata 1.12.6 PostgreSQL Docker deployment.
# https://github.com/open-metadata/OpenMetadata/releases/download/1.12.6-release/docker-compose-postgres.yml

x-openmetadata-environment: &openmetadata-environment
  OPENMETADATA_CLUSTER_NAME: ${OPENMETADATA_CLUSTER_NAME:-openmetadata}
  SERVER_PORT: 8585
  SERVER_ADMIN_PORT: 8586
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

  # Authentication and authorization
  AUTHENTICATION_PROVIDER: ${AUTHENTICATION_PROVIDER:-basic}
  AUTHENTICATION_RESPONSE_TYPE: id_token
  AUTHENTICATION_PUBLIC_KEYS: ${AUTHENTICATION_PUBLIC_KEYS:-[http://localhost:8585/api/v1/system/config/jwks]}
  AUTHENTICATION_ENABLE_SELF_SIGNUP: ${AUTHENTICATION_ENABLE_SELF_SIGNUP:-false}
  AUTHENTICATION_CLIENT_TYPE: public
  AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
  AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
  AUTHORIZER_ADMIN_PRINCIPALS: "[admin]"
  AUTHORIZER_ALLOWED_REGISTRATION_DOMAIN: "[\"all\"]"
  AUTHORIZER_INGESTION_PRINCIPALS: "[ingestion-bot]"
  AUTHORIZER_PRINCIPAL_DOMAIN: open-metadata.org
  AUTHORIZER_ALLOWED_DOMAINS: "[]"
  AUTHORIZER_ENFORCE_PRINCIPAL_DOMAIN: false
  AUTHORIZER_ENABLE_SECURE_SOCKET: false

  # JWT
  RSA_PUBLIC_KEY_FILE_PATH: ./conf/public_key.der
  RSA_PRIVATE_KEY_FILE_PATH: ./conf/private_key.der
  JWT_ISSUER: open-metadata.org
  JWT_KEY_ID: Gb389a-9f76-gdjs-a92j-0242bk94356

  # PostgreSQL
  DB_DRIVER_CLASS: org.postgresql.Driver
  DB_SCHEME: postgresql
  DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
  # The bundled PostgreSQL image provisions these fixed application defaults.
  # Use the official external-database deployment when custom DB credentials
  # or a custom database name are required.
  DB_USER: openmetadata_user
  DB_USER_PASSWORD: openmetadata_password
  DB_HOST: postgresql
  DB_PORT: 5432
  OM_DATABASE: openmetadata_db

  # Elasticsearch
  ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-elasticsearch}
  ELASTICSEARCH_PORT: ${ELASTICSEARCH_PORT:-9200}
  ELASTICSEARCH_SCHEME: ${ELASTICSEARCH_SCHEME:-http}
  ELASTICSEARCH_USER: ""
  ELASTICSEARCH_PASSWORD: ""
  SEARCH_TYPE: ${SEARCH_TYPE:-elasticsearch}
  ELASTICSEARCH_CONNECTION_TIMEOUT_SECS: 5
  ELASTICSEARCH_SOCKET_TIMEOUT_SECS: 60
  ELASTICSEARCH_KEEP_ALIVE_TIMEOUT_SECS: 600
  ELASTICSEARCH_BATCH_SIZE: 100
  ELASTICSEARCH_PAYLOAD_BYTES_SIZE: 10485760
  ELASTICSEARCH_INDEX_MAPPING_LANG: EN

  # Ingestion service
  PIPELINE_SERVICE_CLIENT_ENABLED: ${PIPELINE_SERVICE_CLIENT_ENABLED:-true}
  PIPELINE_SERVICE_CLIENT_CLASS_NAME: org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient
  PIPELINE_SERVICE_CLIENT_ENDPOINT: ${PIPELINE_SERVICE_CLIENT_ENDPOINT:-http://ingestion:8080}
  PIPELINE_SERVICE_CLIENT_HEALTH_CHECK_INTERVAL: 300
  SERVER_HOST_API_URL: ${SERVER_HOST_API_URL:-http://openmetadata-server:8585/api}
  PIPELINE_SERVICE_CLIENT_VERIFY_SSL: no-ssl
  PIPELINE_SERVICE_CLIENT_SSL_CERT_PATH: ""
  PIPELINE_SERVICE_IP_INFO_ENABLED: false
  PIPELINE_SERVICE_CLIENT_HOST_IP: ""
  PIPELINE_SERVICE_CLIENT_SECRETS_MANAGER_LOADER: noop
  AIRFLOW_USERNAME: admin
  AIRFLOW_PASSWORD: admin
  AIRFLOW_TIMEOUT: 10
  AIRFLOW_TRUST_STORE_PATH: ""
  AIRFLOW_TRUST_STORE_PASSWORD: ""
  FERNET_KEY: ${FERNET_KEY:?FERNET_KEY must be set to a valid generated Fernet key}

  # Secrets and memory
  SECRET_MANAGER: ${SECRET_MANAGER:-db}
  OPENMETADATA_HEAP_OPTS: ${OPENMETADATA_HEAP_OPTS:--Xmx1G -Xms1G}
  MASK_PASSWORDS_API: false

services:
  postgresql:
    image: docker.getcollate.io/openmetadata/postgresql:${OPENMETADATA_VERSION:-1.12.6}
    command: --work_mem=10MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -tAc 'select 1' -d openmetadata_db"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms1024m -Xmx1024m
      xpack.security.enabled: "false"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?pretty | grep -qE 'green|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: always

  execute-migrate-all:
    image: docker.getcollate.io/openmetadata/server:${OPENMETADATA_VERSION:-1.12.6}
    command: ./bootstrap/openmetadata-ops.sh migrate
    environment: *openmetadata-environment
    depends_on:
      postgresql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    restart: "no"

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:${OPENMETADATA_VERSION:-1.12.6}
    environment: *openmetadata-environment
    ports:
      - "${OPENMETADATA_BIND_ADDRESS:-127.0.0.1}:${OPENMETADATA_PORT:-8585}:8585"
      - "${OPENMETADATA_BIND_ADDRESS:-127.0.0.1}:${OPENMETADATA_ADMIN_PORT:-8586}:8586"
    depends_on:
      postgresql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      execute-migrate-all:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: always

  ingestion:
    image: docker.getcollate.io/openmetadata/ingestion:${OPENMETADATA_VERSION:-1.12.6}
    entrypoint: /bin/bash
    command: ["/opt/airflow/ingestion_dependency.sh"]
    environment:
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__OPENMETADATA_AIRFLOW_APIS__DAG_GENERATED_CONFIGS: /opt/airflow/dag_generated_configs
      DB_HOST: postgresql
      DB_PORT: 5432
      AIRFLOW_DB: airflow_db
      DB_USER: airflow_user
      DB_SCHEME: postgresql+psycopg2
      DB_PASSWORD: airflow_pass
      DB_PROPERTIES: ""
    ports:
      - "${OPENMETADATA_BIND_ADDRESS:-127.0.0.1}:${INGESTION_PORT:-8080}:8080"
    volumes:
      - ingestion-volume-dag-airflow:/opt/airflow/dag_generated_configs
      - ingestion-volume-dags:/opt/airflow/dags
      - ingestion-volume-tmp:/tmp
    depends_on:
      postgresql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      openmetadata-server:
        condition: service_started
    restart: always

volumes:
  postgres-data:
  elasticsearch-data:
  ingestion-volume-dag-airflow:
  ingestion-volume-dags:
  ingestion-volume-tmp:
